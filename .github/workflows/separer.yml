# Isole la voix d'un spot couvert par la musique et la renvoie au bot MCV VEILLE, qui la transcrit et la classe.
# Plusieurs essais, du plus rapide au plus lent ; on s'arrête au premier que Whisper comprend.
# Dépôt public : les journaux ne doivent contenir ni transcription, ni marque, ni adresse.
name: separer

on:
  workflow_dispatch:
    inputs:
      envoi:
        description: "Numéro de l'envoi dans la base du bot"
        required: true
      silencieux:
        description: "1 = test : le bot ne répond pas dans le groupe"
        required: false
        default: "0"

concurrency:
  group: separer-${{ inputs.envoi }}

jobs:
  separer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      SEPARATION_SECRET: ${{ secrets.SEPARATION_SECRET }}
      ENVOI: ${{ inputs.envoi }}
      SILENCIEUX: ${{ inputs.silencieux }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Modèles Demucs en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: demucs-modeles-v2

      - name: Installation
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -r requirements.txt

      - name: Séparation (plusieurs essais)
        run: bash separer.sh

      - name: Échec signalé au bot
        if: failure()
        run: |
          curl -s -X POST -H "X-Cle: $SEPARATION_SECRET" "$WORKER_URL/separation/echec?id=$ENVOI&silencieux=$SILENCIEUX" > /dev/null || true
