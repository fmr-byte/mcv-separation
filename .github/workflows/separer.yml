# Isole la voix d'un spot couvert par la musique (Demucs), remet le volume à niveau (ffmpeg loudnorm)
# et renvoie la voix au bot MCV VEILLE, qui la transcrit et la classe.
# Dépôt public : les journaux ne doivent contenir ni transcription, ni marque, ni adresse.
name: separer

on:
  workflow_dispatch:
    inputs:
      envoi:
        description: "Numéro de l'envoi dans la base du bot"
        required: true

concurrency:
  group: separer-${{ inputs.envoi }}

jobs:
  separer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      SEPARATION_SECRET: ${{ secrets.SEPARATION_SECRET }}
      ENVOI: ${{ inputs.envoi }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Modèle Demucs en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: demucs-htdemucs-v1

      - name: Installation
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -r requirements.txt

      - name: Séparation et remise à niveau
        run: |
          set -euo pipefail
          curl -sf -H "X-Cle: $SEPARATION_SECRET" "$WORKER_URL/separation/media?id=$ENVOI" -o entree.bin
          ffmpeg -v error -y -i entree.bin -vn -ac 2 -ar 44100 entree.wav
          python -m demucs --two-stems=vocals -n htdemucs -o sortie entree.wav > /dev/null 2>&1
          ffmpeg -v error -y -i sortie/htdemucs/entree/vocals.wav -af loudnorm -ar 16000 -ac 1 -sample_fmt s16 voix.wav
          echo "Voix isolée : $(stat -c %s voix.wav) octets"

      - name: Retour au bot
        run: |
          curl -sf -X POST -H "X-Cle: $SEPARATION_SECRET" -H "content-type: audio/wav" \
            --data-binary @voix.wav "$WORKER_URL/separation/resultat?id=$ENVOI" > /dev/null
          echo "Voix renvoyée au bot"

      - name: Échec signalé au bot
        if: failure()
        run: |
          curl -s -X POST -H "X-Cle: $SEPARATION_SECRET" "$WORKER_URL/separation/echec?id=$ENVOI" > /dev/null || true
